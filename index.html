<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Atalhos - Gerenciador de Documentos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        md: {
                            primary: '#6750A4',
                            primaryContainer: '#EADDFF',
                            onPrimaryContainer: '#21005D',
                            surface: '#FEF7FF',
                            surfaceVariant: '#E7E0EC',
                            onSurface: '#1D1B20',
                            onSurfaceVariant: '#49454F',
                            outline: '#79747E',
                            darkSurface: '#141218',
                            darkSurfaceVariant: '#49454F',
                            darkOnSurface: '#E6E0E9',
                            darkPrimaryContainer: '#4F378B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth scrolling and material design touch responses */
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-slate-800 dark:text-zinc-100 h-full flex flex-col font-sans transition-colors duration-200">

    <!-- Top App Bar -->
    <header class="sticky top-0 z-20 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-slate-200 dark:border-zinc-800 px-4 py-3 shadow-sm transition-colors">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-folder-tree text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Meus Atalhos</h1>
                    <p class="text-xs text-slate-500 dark:text-zinc-400">Documentos & Arquivos</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1">
                <!-- Theme Toggle -->
                <button id="themeToggleBtn" onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="max-w-md mx-auto mt-3">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 dark:text-zinc-500"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Buscar documento ou palavra-chave..." 
                       class="w-full pl-10 pr-9 py-2.5 bg-slate-100 dark:bg-zinc-800/80 border-none rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-zinc-800 text-slate-800 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 transition-all outline-none">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 overflow-y-auto">
        
        <!-- Category Filter Chips -->
        <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-2 hide-scrollbar" id="categoryChips">
            <!-- Chips will be generated by JS -->
        </div>

        <!-- Document List grouped by Categories -->
        <div id="documentsContainer" class="space-y-6">
            <!-- Content dynamic render -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center">
            <div class="w-16 h-16 rounded-full bg-slate-200 dark:bg-zinc-800 flex items-center justify-center text-slate-400 dark:text-zinc-500 mb-3 text-2xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <p class="font-medium text-slate-600 dark:text-zinc-400">Nenhum documento encontrado</p>
            <p class="text-xs text-slate-400 dark:text-zinc-500 max-w-xs mt-1">Tente pesquisar por outro termo ou adicione um novo atalho usando o botão abaixo.</p>
        </div>

    </main>

    <!-- Floating Action Button (FAB) -->
    <div class="fixed bottom-6 right-6 z-30 max-w-md mx-auto">
        <button onclick="openModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-3.5 rounded-2xl shadow-lg shadow-indigo-500/30 active:scale-95 transition-all">
            <i class="fa-solid fa-plus text-lg"></i>
            <span class="text-sm">Novo Atalho</span>
        </button>
    </div>

    <!-- Modal Form (Add/Edit Shortcut) -->
    <div id="docModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-200" id="modalCard">
            
            <div class="flex items-center justify-between mb-4">
                <h2 id="modalTitle" class="text-lg font-bold text-slate-800 dark:text-zinc-100">Novo Atalho</h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="docForm" onsubmit="saveDocument(event)" class="space-y-4">
                <input type="hidden" id="docId">

                <!-- Title Input -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-zinc-400 mb-1">Nome do Documento *</label>
                    <input type="text" id="docName" required placeholder="Ex: Programa da Academia" 
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-zinc-100">
                </div>

                <!-- Category Selection / Creation -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-slate-600 dark:text-zinc-400">Categoria *</label>
                        <button type="button" onclick="toggleNewCategoryInput()" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">
                            + Nova categoria
                        </button>
                    </div>
                    <select id="docCategorySelect" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-zinc-100">
                        <!-- Populated by JS -->
                    </select>
                    <div id="newCategoryWrapper" class="hidden mt-2">
                        <input type="text" id="newCategoryInput" placeholder="Nome da nova categoria" 
                               class="w-full px-3.5 py-2 bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-zinc-100">
                    </div>
                </div>

                <!-- File Type Selection -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-zinc-400 mb-1">Tipo de Arquivo *</label>
                    <div class="grid grid-cols-4 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="docType" value="pdf" class="peer hidden" checked>
                            <div class="flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 dark:border-zinc-700 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 dark:peer-checked:bg-indigo-950/40 peer-checked:text-indigo-600 dark:peer-checked:text-indigo-400 text-slate-500 dark:text-zinc-400 transition">
                                <i class="fa-solid fa-file-pdf text-xl mb-1 text-red-500"></i>
                                <span class="text-xs font-medium">PDF</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="docType" value="word" class="peer hidden">
                            <div class="flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 dark:border-zinc-700 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 dark:peer-checked:bg-indigo-950/40 peer-checked:text-indigo-600 dark:peer-checked:text-indigo-400 text-slate-500 dark:text-zinc-400 transition">
                                <i class="fa-solid fa-file-word text-xl mb-1 text-blue-500"></i>
                                <span class="text-xs font-medium">Word</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="docType" value="excel" class="peer hidden">
                            <div class="flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 dark:border-zinc-700 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 dark:peer-checked:bg-indigo-950/40 peer-checked:text-indigo-600 dark:peer-checked:text-indigo-400 text-slate-500 dark:text-zinc-400 transition">
                                <i class="fa-solid fa-file-excel text-xl mb-1 text-emerald-500"></i>
                                <span class="text-xs font-medium">Excel</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="docType" value="generic" class="peer hidden">
                            <div class="flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 dark:border-zinc-700 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 dark:peer-checked:bg-indigo-950/40 peer-checked:text-indigo-600 dark:peer-checked:text-indigo-400 text-slate-500 dark:text-zinc-400 transition">
                                <i class="fa-solid fa-file text-xl mb-1 text-slate-400"></i>
                                <span class="text-xs font-medium">Outro</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Link or Local File Option -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-zinc-400 mb-1">Origem do Arquivo</label>
                    <div class="space-y-2">
                        <!-- Local File Upload Simulation -->
                        <div>
                            <input type="file" id="fileInput" onchange="handleFileSelect(event)" class="hidden">
                            <button type="button" onclick="document.getElementById('fileInput').click()" 
                                    class="w-full py-2 px-3 border border-dashed border-slate-300 dark:border-zinc-700 rounded-xl text-xs text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800 flex items-center justify-center gap-2 transition">
                                <i class="fa-solid fa-paperclip"></i>
                                <span id="fileNameLabel">Selecionar Arquivo Local...</span>
                            </button>
                        </div>
                        <p class="text-[10px] text-center text-slate-400">OU insira um link direto abaixo:</p>
                        <!-- Web Link -->
                        <input type="url" id="docUrl" placeholder="https://exemplo.com/meu-documento.pdf" 
                               class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-zinc-100">
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex items-center justify-end gap-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs font-medium text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-medium shadow-md transition">
                        Salvar Atalho
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Message -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 dark:bg-zinc-100 text-white dark:text-slate-900 px-4 py-2.5 rounded-full text-xs font-medium shadow-lg opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMsg">Mensagem</span>
    </div>

    <script>
        // Default initial data specified by user
        const defaultData = [
            // Saúde
            { id: '1', title: 'Programa da academia', category: 'Saúde', type: 'pdf', url: '', fileName: 'academia_treino.pdf' },
            { id: '2', title: 'Programa de dietas', category: 'Saúde', type: 'excel', url: '', fileName: 'dieta_semanal.xlsx' },
            // Acadêmicos
            { id: '3', title: 'Conteúdo de química orgânica', category: 'Acadêmicos', type: 'word', url: '', fileName: 'resumo_organica.docx' },
            { id: '4', title: 'Conteúdo de físico-química', category: 'Acadêmicos', type: 'pdf', url: '', fileName: 'fisico_quimica_aula1.pdf' },
            // Receitas
            { id: '5', title: 'Doces', category: 'Receitas', type: 'pdf', url: '', fileName: 'livro_doces.pdf' },
            { id: '6', title: 'Salgados', category: 'Receitas', type: 'word', url: '', fileName: 'receitas_salgados.docx' },
            { id: '7', title: 'Bebidas', category: 'Receitas', type: 'excel', url: '', fileName: 'coquetéis_e_sucos.xlsx' }
        ];

        let documents = [];
        let activeCategoryFilter = 'Todos';
        let currentFileData = null;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
            initTheme();
            renderCategoryChips();
            renderDocuments();
        });

        // Local Storage Logic
        function loadDocuments() {
            const saved = localStorage.getItem('vibe_app_shortcuts');
            if (saved) {
                try {
                    documents = JSON.parse(saved);
                } catch(e) {
                    documents = [...defaultData];
                }
            } else {
                documents = [...defaultData];
                saveToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('vibe_app_shortcuts', JSON.stringify(documents));
        }

        // Theme Toggle (Dark / Light)
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon text-slate-600';
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('themeIcon').className = 'fa-solid fa-moon text-slate-600';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-400';
            }
        }

        // Get unique categories list
        function getCategories() {
            const cats = new Set(documents.map(doc => doc.category));
            return Array.from(cats);
        }

        // Render Filter Chips
        function renderCategoryChips() {
            const container = document.getElementById('categoryChips');
            const categories = ['Todos', ...getCategories()];
            
            container.innerHTML = categories.map(cat => {
                const isActive = activeCategoryFilter === cat;
                return `
                    <button onclick="setCategoryFilter('${cat}')" 
                            class="px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
                                isActive 
                                ? 'bg-indigo-600 text-white shadow-sm' 
                                : 'bg-white dark:bg-zinc-800 text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700/60 hover:bg-slate-50 dark:hover:bg-zinc-700'
                            }">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function setCategoryFilter(cat) {
            activeCategoryFilter = cat;
            renderCategoryChips();
            renderDocuments();
        }

        // Return Icon and Color styling based on File Type
        function getFileTypeBadge(type) {
            switch(type) {
                case 'pdf':
                    return { icon: 'fa-file-pdf', color: 'text-red-500 bg-red-50 dark:bg-red-950/40 border-red-200 dark:border-red-900/50', label: 'PDF' };
                case 'word':
                    return { icon: 'fa-file-word', color: 'text-blue-500 bg-blue-50 dark:bg-blue-950/40 border-blue-200 dark:border-blue-900/50', label: 'Word' };
                case 'excel':
                    return { icon: 'fa-file-excel', color: 'text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900/50', label: 'Excel' };
                default:
                    return { icon: 'fa-file', color: 'text-slate-500 bg-slate-50 dark:bg-zinc-800 border-slate-200 dark:border-zinc-700', label: 'Doc' };
            }
        }

        // Render Main Document Cards
        function renderDocuments() {
            const container = document.getElementById('documentsContainer');
            const emptyState = document.getElementById('emptyState');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();

            // Filter documents by category and search term
            let filteredDocs = documents.filter(doc => {
                const matchesCategory = activeCategoryFilter === 'Todos' || doc.category === activeCategoryFilter;
                const matchesSearch = doc.title.toLowerCase().includes(searchKeyword) || 
                                      doc.category.toLowerCase().includes(searchKeyword) ||
                                      (doc.fileName && doc.fileName.toLowerCase().includes(searchKeyword));
                return matchesCategory && matchesSearch;
            });

            if (filteredDocs.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            // Group filtered documents by Category
            const grouped = {};
            filteredDocs.forEach(doc => {
                if (!grouped[doc.category]) grouped[doc.category] = [];
                grouped[doc.category].push(doc);
            });

            let html = '';

            for (const [category, items] of Object.entries(grouped)) {
                html += `
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between px-1">
                            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">${category}</h2>
                            <span class="text-[10px] bg-slate-200 dark:bg-zinc-800 px-2 py-0.5 rounded-full text-slate-500 dark:text-zinc-400 font-medium">${items.length}</span>
                        </div>
                        <div class="grid grid-cols-1 gap-2.5">
                            ${items.map(doc => {
                                const badge = getFileTypeBadge(doc.type);
                                return `
                                    <div class="bg-white dark:bg-zinc-900 border border-slate-200/80 dark:border-zinc-800 rounded-2xl p-3.5 flex items-center justify-between gap-3 shadow-xs hover:shadow-md transition">
                                        <div class="flex items-center gap-3.5 min-w-0">
                                            <div class="w-11 h-11 rounded-xl flex items-center justify-center text-lg border ${badge.color} shrink-0">
                                                <i class="fa-solid ${badge.icon}"></i>
                                            </div>
                                            <div class="min-w-0">
                                                <h3 class="text-sm font-semibold text-slate-800 dark:text-zinc-100 truncate">${doc.title}</h3>
                                                <p class="text-xs text-slate-400 dark:text-zinc-500 truncate mt-0.5">
                                                    ${doc.fileName || (doc.url ? 'Link Web' : 'Atalho do Sistema')}
                                                </p>
                                            </div>
                                        </div>

                                        <div class="flex items-center gap-1 shrink-0">
                                            <!-- Open / View Action -->
                                            <button onclick="openDocument('${doc.id}')" title="Abrir Documento" 
                                                    class="w-8 h-8 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs hover:bg-indigo-100 dark:hover:bg-indigo-900 transition">
                                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                            </button>
                                            
                                            <!-- More Actions (Edit/Delete) -->
                                            <button onclick="editDocument('${doc.id}')" title="Editar" 
                                                    class="w-8 h-8 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-zinc-800 flex items-center justify-center text-xs transition">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>
                                            <button onclick="deleteDocument('${doc.id}')" title="Excluir" 
                                                    class="w-8 h-8 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 flex items-center justify-center text-xs transition">
                                                <i class="fa-solid fa-trash-can"></i>
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // File Handler (Simulation & Link Generator)
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                currentFileData = {
                    name: file.name,
                    size: file.size
                };
                document.getElementById('fileNameLabel').innerText = file.name;
                
                // Auto detect file type
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext === 'pdf') selectTypeRadio('pdf');
                else if (['doc', 'docx'].includes(ext)) selectTypeRadio('word');
                else if (['xls', 'xlsx', 'csv'].includes(ext)) selectTypeRadio('excel');
                else selectTypeRadio('generic');
            }
        }

        function selectTypeRadio(type) {
            const radio = document.querySelector(`input[name="docType"][value="${type}"]`);
            if (radio) radio.checked = true;
        }

        // Search Input Handling
        function handleSearch() {
            const val = document.getElementById('searchInput').value;
            const clearBtn = document.getElementById('clearSearchBtn');
            if (val.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderDocuments();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderDocuments();
        }

        // Modal Control Logic
        function openModal(editId = null) {
            populateCategorySelect();
            const modal = document.getElementById('docModal');
            const card = document.getElementById('modalCard');
            
            // Reset form
            document.getElementById('docForm').reset();
            document.getElementById('docId').value = '';
            document.getElementById('fileNameLabel').innerText = 'Selecionar Arquivo Local...';
            document.getElementById('newCategoryWrapper').classList.add('hidden');
            currentFileData = null;

            if (editId) {
                const doc = documents.find(d => d.id === editId);
                if (doc) {
                    document.getElementById('modalTitle').innerText = 'Editar Atalho';
                    document.getElementById('docId').value = doc.id;
                    document.getElementById('docName').value = doc.title;
                    document.getElementById('docCategorySelect').value = doc.category;
                    document.getElementById('docUrl').value = doc.url || '';
                    if (doc.fileName) {
                        document.getElementById('fileNameLabel').innerText = doc.fileName;
                    }
                    selectTypeRadio(doc.type);
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Novo Atalho';
                selectTypeRadio('pdf');
            }

            modal.classList.remove('pointer-events-none', 'opacity-0');
            card.classList.remove('translate-y-full');
        }

        function closeModal() {
            const modal = document.getElementById('docModal');
            const card = document.getElementById('modalCard');
            
            card.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('pointer-events-none');
            }, 200);
        }

        function toggleNewCategoryInput() {
            const wrapper = document.getElementById('newCategoryWrapper');
            wrapper.classList.toggle('hidden');
            if (!wrapper.classList.contains('hidden')) {
                document.getElementById('newCategoryInput').focus();
            }
        }

        function populateCategorySelect() {
            const select = document.getElementById('docCategorySelect');
            const categories = getCategories();
            
            select.innerHTML = categories.map(cat => 
                `<option value="${cat}">${cat}</option>`
            ).join('');
        }

        // Save Document Shortcut
        function saveDocument(event) {
            event.preventDefault();

            const id = document.getElementById('docId').value;
            const name = document.getElementById('docName').value.trim();
            const newCatInput = document.getElementById('newCategoryInput').value.trim();
            const selectCat = document.getElementById('docCategorySelect').value;
            const category = newCatInput ? newCatInput : selectCat;
            const type = document.querySelector('input[name="docType"]:checked').value;
            const url = document.getElementById('docUrl').value.trim();

            let fileName = currentFileData ? currentFileData.name : '';

            if (id) {
                // Update existing
                const index = documents.findIndex(d => d.id === id);
                if (index !== -1) {
                    documents[index] = {
                        ...documents[index],
                        title: name,
                        category: category,
                        type: type,
                        url: url,
                        fileName: fileName || documents[index].fileName
                    };
                    showToast('Atalho atualizado com sucesso!');
                }
            } else {
                // Create new
                const newDoc = {
                    id: Date.now().toString(),
                    title: name,
                    category: category,
                    type: type,
                    url: url,
                    fileName: fileName || (type.toUpperCase() + ' - Documento')
                };
                documents.unshift(newDoc);
                showToast('Atalho criado com sucesso!');
            }

            saveToStorage();
            renderCategoryChips();
            renderDocuments();
            closeModal();
        }

        function editDocument(id) {
            openModal(id);
        }

        function deleteDocument(id) {
            const doc = documents.find(d => d.id === id);
            if (doc && confirm(`Deseja realmente excluir o atalho "${doc.title}"?`)) {
                documents = documents.filter(d => d.id !== id);
                saveToStorage();
                renderCategoryChips();
                renderDocuments();
                showToast('Atalho removido');
            }
        }

        // Action when clicking on document (Open link or simulate local file open)
        function openDocument(id) {
            const doc = documents.find(d => d.id === id);
            if (!doc) return;

            if (doc.url) {
                window.open(doc.url, '_blank');
            } else {
                // Simulation alert for local files / shortcuts
                showToast(`Abrindo: ${doc.title} (${doc.fileName || doc.type})`);
            }
        }

        // Toast Messages
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
